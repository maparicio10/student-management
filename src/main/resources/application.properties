spring.application.name=student-management
# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jersey configuration
spring.jersey.application-path=/api
spring.jersey.type=servlet

# External API Configuration
external.api.jsonplaceholder.url=https://jsonplaceholder.typicode.com
external.soap.countryinfo.url=http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.example.studentcrud=DEBUG
logging.level.org.springframework.web=DEBUG